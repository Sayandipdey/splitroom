<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SplitRoom — Real-Time Room Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#111827;--mu:#6b7280;--bd:#e5e7eb;--ac:#4f46e5;--ac2:#eef2ff;--ok:#059669;--okb:#d1fae5;--wa:#b45309;--wab:#fef3c7;--bad:#dc2626;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#8b949e;--bd:#30363d;--ac:#818cf8;--ac2:#1e2140;--ok:#34d399;--okb:#0f2f26;--wa:#fbbf24;--wab:#33280d;--bad:#f87171}}
:root[data-theme="dark"]{--bg:#0d1117;--card:#161b22;--tx:#e6edf3;--mu:#8b949e;--bd:#30363d;--ac:#818cf8;--ac2:#1e2140;--ok:#34d399;--okb:#0f2f26;--wa:#fbbf24;--wab:#33280d;--bad:#f87171}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.5 Inter,system-ui,sans-serif;transition:background .2s,color .2s}
.w{max-width:880px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;margin-bottom:14px;transition:border-color .15s,transform .15s}
h1{font-size:22px;margin:0}h2{font-size:15px;margin:0 0 10px}.mu{color:var(--mu)}.mono{font-family:'JetBrains Mono',monospace}
input,select,textarea,button{font:inherit;color:var(--tx)}
input,select,textarea{width:100%;background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 11px;outline:none;transition:border-color .15s,box-shadow .15s}
input:focus,select:focus,textarea:focus{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac2)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 4px}
button{cursor:pointer;border:1px solid var(--bd);background:var(--card);border-radius:9px;padding:8px 13px;font-weight:500;transition:transform .1s,background .15s}
button:hover{background:var(--ac2)}button:active{transform:scale(.97)}button:disabled{opacity:.45;cursor:not-allowed}
.pri{background:var(--ac);border-color:var(--ac);color:#fff}.pri:hover{background:var(--ac);filter:brightness(1.1)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1 1 140px}.top{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.grid2{display:grid;gap:14px;grid-template-columns:1fr}@media(min-width:720px){.grid2{grid-template-columns:1fr 1fr}}
.chip{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;background:var(--ac2);color:var(--ac);margin:2px;cursor:default}
button.chip{cursor:pointer;border:1px solid var(--ac);padding:3px 11px}
.bal{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px dashed var(--bd)}.bal:last-child{border:0}
.amt{font-weight:700}.pos{color:var(--ok)}.neg{color:var(--bad)}
.ex{position:relative}.ex:hover{border-color:var(--ac)}.ex.lk{opacity:.75;border-style:dashed}.ex.flash{animation:fl 1.2s}@keyframes fl{from{background:var(--ac2)}}
.b{display:inline-block;font-size:11px;padding:1px 8px;border-radius:99px;font-weight:600}
.b.ok{background:var(--okb);color:var(--ok)}.b.wa{background:var(--wab);color:var(--wa)}.b.ed{background:var(--ac2);color:var(--ac)}
.ms{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:14px 0;padding:10px 14px;border-radius:12px;font-weight:600;font-size:13px;border:2px dashed}
.ms.pe{background:var(--wab);color:var(--wa);border-color:var(--wa)}.ms.ok{background:var(--okb);color:var(--ok);border-color:var(--ok)}
.hist{font-size:12px;color:var(--mu);margin-top:6px;padding:6px 10px;border-left:3px solid var(--ac);background:var(--ac2);border-radius:0 8px 8px 0}
.cm{padding:6px 0 6px 10px;border-left:2px solid var(--bd);margin-top:6px;font-size:13px}.cm .cm{margin-left:14px}
.tag{color:var(--ac);font-weight:600}.sm{padding:3px 9px;font-size:12px}.cf{display:flex;gap:6px;margin-top:8px}.cf input{flex:1}.cf button{flex:0 0 auto}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:13px;z-index:9;animation:up .2s}@keyframes up{from{opacity:0;transform:translate(-50%,10px)}}
.hide{display:none!important}.live{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px}
.cnt{display:flex;gap:6px;flex-wrap:wrap;align-items:center}.cnt>input{flex:1 1 200px}
</style></head><body><div class="w">

<div id="land">
 <div class="top"><div><h1>💸 SplitRoom</h1><div class="mu">Shared expenses, no sign-up. Just a Room ID.</div></div><button data-act="theme">◐ Theme</button></div>
 <div class="grid2">
  <div class="card"><h2>Create a room</h2>
   <label>Your name</label><input id="cn" placeholder="e.g. Sandy" maxlength="24">
   <label>Other members (comma separated)</label><input id="cm" placeholder="Rahul, Amit">
   <label>Currency</label><select id="cc"><option>₹</option><option>$</option><option>€</option><option>£</option></select>
   <div style="margin-top:14px"><button class="pri" data-act="create" style="width:100%">Generate Room ID</button></div></div>
  <div class="card"><h2>Join a room</h2>
   <label>Room ID</label><input id="jr" placeholder="RM-XXXXXXXXXX" class="mono">
   <div id="j2" class="hide"><label>Pick your name</label><div id="jn"></div><label>…or type a new one</label><input id="jt" maxlength="24"></div>
   <div style="margin-top:14px"><button class="pri" data-act="join" id="jb" style="width:100%">Find room</button></div></div>
 </div>
 <div class="mu" style="font-size:12px;text-align:center" id="ld"></div>
</div>

<div id="app" class="hide">
 <div class="top"><div><h1>💸 <span id="rt"></span></h1><div class="mu" style="font-size:12px">You are <b id="me"></b> <span id="mode" class="live"></span></div></div>
  <div class="cnt"><button data-act="theme">◐</button><button data-act="leave">Leave</button></div></div>
 <div class="card"><div class="cnt"><span class="mu">Room ID</span><input id="ri" readonly class="mono"><button data-act="cprid">Copy ID</button><button class="pri" data-act="cplink">Copy invite link</button></div>
  <div id="mem" style="margin-top:8px"></div></div>
 <div class="grid2">
  <div class="card"><h2>⚖️ Live balance <span class="mu" style="font-weight:400">(unsettled)</span></h2><div id="bal"></div></div>
  <div class="card"><h2 id="ft">➕ Add expense</h2>
   <div class="row"><div><label>Amount</label><input id="fa" type="number" inputmode="decimal" step="0.01" min="0"></div><div><label>Paid by</label><select id="fp"></select></div></div>
   <label>Description</label><input id="fd" maxlength="80" placeholder="Groceries, Wi-Fi…">
   <div class="row"><div><label>Category</label><select id="fc"><option>Breakfast</option><option>Lunch</option><option>Dinner</option><option>Food</option><option>Rent</option><option>Utilities</option><option>Groceries</option><option>Transport</option><option>Fun</option><option>Other</option></select></div><div><label>Date</label><input id="fx" type="date"></div></div>
   <label style="display:flex;align-items:center;gap:8px;font-size:13px;font-weight:500;color:var(--tx);margin-top:14px;cursor:pointer"><input type="checkbox" id="fv" style="width:auto"> 👤 Personal expense — not split, only for the payer</label><div class="cnt" style="margin-top:14px"><button class="pri" data-act="save" id="fs">Add expense</button><button data-act="cancel" id="fcx" class="hide">Cancel edit</button></div></div>
 </div>
 <div class="card"><h2>📄 Statement</h2>
  <div class="row"><div><label>Start date</label><input id="ds" type="date"></div><div><label>End date</label><input id="de" type="date"></div></div>
  <div style="margin-top:14px"><button class="pri" data-act="pdf">Download Statement as PDF</button></div></div>
 <div class="top"><h2 style="margin:0">Ledger</h2><button data-act="mark" id="mk">✓ Mark Status: Paid Up To This Point</button></div>
 <div class="row" style="margin-bottom:12px"><select id="lf"><option value="">All expenses</option><option value="s">Shared only</option><option value="p">Personal only</option></select><select id="lc"></select></div>
 <div id="led"></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,onSnapshot} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
/* Firebase web-app config (not secret; Firestore rules protect the data) */
const FIREBASE_CONFIG={apiKey:"AIzaSyCz4cWyrGR_vE4krt8oNklUUZV2ct4GNP8",authDomain:"splitroom-2b34f.firebaseapp.com",projectId:"splitroom-2b34f",storageBucket:"splitroom-2b34f.firebasestorage.app",messagingSenderId:"997874683183",appId:"1:997874683183:web:74727e3fed6b98c27625da"};
let fdb=null;try{if(!FIREBASE_CONFIG.projectId.startsWith('PASTE'))fdb=getFirestore(initializeApp(FIREBASE_CONFIG))}catch(e){console.error(e)}
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6),today=()=>new Date().toISOString().slice(0,10);
const ls={g:k=>{try{return localStorage.getItem(k)}catch(e){return null}},s:(k,v)=>{try{localStorage.setItem(k,v)}catch(e){}},d:k=>{try{localStorage.removeItem(k)}catch(e){}}};
let db=null,mode='local',RID,P,ME,room,exps=[],cms=[],mss=[],unsubs=[],edId=null,open=new Set(),rep={},L={},CUR='₹';
const dbP=Promise.resolve();mode=fdb?'live':'local';
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent=t;document.body.append(e);setTimeout(()=>e.remove(),2600)}
/* ---- store: live db (realtime) with localStorage fallback ---- */
function sub(path,cb){
 if(mode==='live')return onSnapshot(collection(fdb,path),s=>cb(s.docs.map(d=>({...d.data(),id:d.id}))),e=>toast('Sync error: '+e.code));
 const k='sr:'+path,f=()=>{let a=[];try{a=JSON.parse(ls.g(k)||'[]')}catch(e){}cb(a)};(L[path]=L[path]||new Set()).add(f);f();
 const h=e=>{(!e.key||e.key===k)&&f()};addEventListener('storage',h);return()=>{L[path].delete(f);removeEventListener('storage',h)}}
async function put(path,o){const {id,...d}=o;
 try{if(mode==='live'){await setDoc(doc(fdb,path,id),d);return true}
 const k='sr:'+path;let a=[];try{a=JSON.parse(ls.g(k)||'[]')}catch(e){}const i=a.findIndex(x=>x.id===id);i<0?a.push(o):a[i]=o;ls.s(k,JSON.stringify(a));(L[path]||[]).forEach(f=>f());return true}
 catch(e){toast("Couldn't save — check your connection and Firestore rules");return false}}
/* ---- landing ---- */
const dk='sr:theme';function theme(){const r=document.documentElement,d=r.dataset.theme||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light');r.dataset.theme=d==='dark'?'light':'dark';ls.s(dk,r.dataset.theme)}
if(ls.g(dk))document.documentElement.dataset.theme=ls.g(dk);
const rid=()=>'RM-'+[...crypto.getRandomValues(new Uint8Array(10))].map(b=>'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'[b%32]).join('');
const names=s=>[...new Set(s.split(',').map(x=>x.trim()).filter(Boolean))];
async function create(){const n=$('#cn').value.trim();if(!n)return toast('Enter your name');await dbP;
 const id=rid(),members=[...new Set([n,...names($('#cm').value)])];
 if(await put('rooms/'+id+'/meta',{id:'room',name:'Room '+id.slice(3,7),members,cur:$('#cc').value,created:Date.now(),by:n}))enter(id,n,true)}
function lookup(r){return dbP.then(()=>new Promise(res=>{let u,d=0;u=sub('rooms/'+r+'/meta',a=>{if(d)return;d=1;res(a.find(x=>x.id==='room')||null);setTimeout(()=>u&&u())})}))}
let found=null;
async function join(){const r=$('#jr').value.trim().toUpperCase();
 if(!found||found.rid!==r){if(!/^RM-[A-Z0-9]{10}$/.test(r))return toast('Room IDs look like RM-XXXXXXXXXX');$('#jb').textContent='Searching…';
  const m=await lookup(r);$('#jb').textContent='Find room';if(!m)return toast('Room not found');found={rid:r,m};
  $('#jn').innerHTML=m.members.map(x=>`<button class="chip" data-act="pick" data-n="${esc(x)}">${esc(x)}</button>`).join('');$('#j2').classList.remove('hide');$('#jb').textContent='Enter room';return}
 const n=$('#jt').value.trim();if(!n)return toast('Pick or type your name');await enterAs(n)}
async function enterAs(n){const m=found.m;if(!m.members.includes(n))await put('rooms/'+found.rid+'/meta',{...m,members:[...m.members,n]});enter(found.rid,n)}
/* ---- app ---- */
async function enter(id,name,fresh){await dbP;RID=id;P='rooms/'+id;ME=name;ls.s('sr:me:'+id,name);ls.s('sr:last',id);location.hash=id;
 $('#land').classList.add('hide');$('#app').classList.remove('hide');$('#me').textContent=ME;$('#ri').value=id;$('#fx').value=today();
 const m=$('#mode');m.textContent=mode==='live'?'● live sync':'● local only (add Firebase config)';m.style.cssText=mode==='live'?'background:var(--okb);color:var(--ok)':'background:var(--wab);color:var(--wa)';
 unsubs=[sub(P+'/meta',a=>{room=a.find(x=>x.id==='room');if(room){CUR=room.cur||'₹';rMeta();rAll()}}),
  sub(P+'/exp',a=>{const o=new Set(exps.map(e=>e.id));exps=a;rAll(a.filter(e=>o.size&&!o.has(e.id)).map(e=>e.id))}),
  sub(P+'/cm',a=>{cms=a;rLed()}),sub(P+'/ms',a=>{mss=a;rAll()})];
 if(fresh)toast('Room created — copy the invite link to share it')}
function leave(){unsubs.forEach(u=>u&&u());unsubs=[];exps=[];cms=[];mss=[];room=null;ls.d('sr:last');history.replaceState(null,'',location.pathname);$('#app').classList.add('hide');$('#land').classList.remove('hide');found=null;$('#j2').classList.add('hide');$('#jb').textContent='Find room'}
function rMeta(){$('#rt').textContent=room.name;$('#mem').innerHTML=room.members.map(m=>`<span class="chip">${esc(m)}${m===ME?' (you)':''}</span>`).join('');
 const v=$('#fp').value||ME;$('#fp').innerHTML=room.members.map(m=>`<option ${m===v?'selected':''}>${esc(m)}</option>`).join('')}
const money=x=>CUR+x.toFixed(2),lastOk=()=>Math.max(0,...mss.filter(m=>m.st==='ok').map(m=>m.ts)),locked=e=>e.ts<=lastOk();
function calc(list){const n={};room.members.forEach(m=>n[m]=0);list.filter(e=>!e.personal).forEach(e=>{const s=e.amount/room.members.length;n[e.paidBy]=(n[e.paidBy]||0)+e.amount;room.members.forEach(m=>n[m]-=s)});return n}
function xfers(n){const d=[],c=[];for(const m in n){const v=Math.round(n[m]*100)/100;v<-.005?d.push([m,-v]):v>.005&&c.push([m,v])}d.sort((a,b)=>b[1]-a[1]);c.sort((a,b)=>b[1]-a[1]);const t=[];let i=0,j=0;
 while(i<d.length&&j<c.length){const x=Math.min(d[i][1],c[j][1]);t.push([d[i][0],c[j][0],x]);d[i][1]-=x;c[j][1]-=x;if(d[i][1]<.005)i++;if(c[j][1]<.005)j++}return t}
function rAll(fl){rBal();rLed(fl)}
function rBal(){if(!room)return;const u=exps.filter(e=>!locked(e)&&!e.personal),n=calc(u),t=xfers(n),pp={};exps.filter(e=>e.personal).forEach(e=>pp[e.paidBy]=(pp[e.paidBy]||0)+e.amount);
 $('#bal').innerHTML=(t.length?t.map(([a,b,x])=>`<div class="bal"><span><b>${esc(a)}</b> owes <b>${esc(b)}</b></span><span class="amt neg">${money(x)}</span></div>`).join(''):'<div class="mu">All square 🎉</div>')+
 `<div class="mu" style="margin-top:10px;font-size:12px">Unsettled total ${money(u.reduce((s,e)=>s+e.amount,0))} · split equally among ${room.members.length}</div>`+(Object.keys(pp).length?`<h2 style="margin-top:14px">👤 Personal spending <span class="mu" style="font-weight:400">(not split)</span></h2>`+Object.entries(pp).map(([k,v])=>`<div class="bal"><span>${esc(k)}</span><span class="amt">${money(v)}</span></div>`).join(''):'')}
const fmt=t=>new Date(t).toLocaleString([],{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
const tags=s=>esc(s).replace(/@([\p{L}\w]+)/gu,'<span class="tag">@$1</span>');
function cmH(c,eid,sub){return `<div class="cm"><b>${esc(c.by)}</b> <span class="mu" style="font-size:11px">${fmt(c.ts)}</span><div>${tags(c.text)}</div>${sub?'':`<button class="sm" data-act="rp" data-e="${eid}" data-c="${c.id}" data-by="${esc(c.by)}">Reply</button>`}${cms.filter(r=>r.parent===c.id).sort((a,b)=>a.ts-b.ts).map(r=>cmH(r,eid,1)).join('')}</div>`}
function rLed(fl=[]){if(!room)return;const keep={};document.querySelectorAll('.cin').forEach(i=>keep[i.id]=i.value);const fo=document.activeElement&&document.activeElement.id;
 const pend=mss.some(m=>m.st==='pe');$('#mk').disabled=pend||!exps.length;
 const fT=$('#lf').value,fC=$('#lc').value,vis=exps.filter(e=>(!fT||(fT==='p')===!!e.personal)&&(!fC||e.cat===fC));
 const it=[...vis.map(e=>({k:'e',ts:e.ts,e})),...mss.map(m=>({k:'m',ts:m.ts,m}))].sort((a,b)=>b.ts-a.ts);
 $('#led').innerHTML=it.length?it.map(x=>{
  if(x.k==='m'){const m=x.m,p=m.st==='pe';return `<div class="ms ${p?'pe':'ok'}"><span>${p?'⏳ Pending — paid up to this point':'🔒 Settled — paid up to this point'} · ${esc(m.by)} · ${fmt(m.ts)}${p?'':' · approved by '+esc(m.ap)}</span>${p?(m.by!==ME?`<button class="pri sm" data-act="ap" data-id="${m.id}">Approve / Verify</button>`:'<i style="font-weight:400">awaiting the other party</i>'):''}</div>`}
  const e=x.e,lk=locked(e),cs=cms.filter(c=>c.eid===e.id&&!c.parent).sort((a,b)=>a.ts-b.ts),n=cms.filter(c=>c.eid===e.id).length,o=open.has(e.id),r=rep[e.id];
  return `<div class="card ex ${lk?'lk':''} ${fl.includes(e.id)?'flash':''}"><div class="row" style="justify-content:space-between;flex-wrap:nowrap"><div style="flex:1"><b>${esc(e.desc)}</b><div class="mu" style="font-size:12px">${esc(e.date)} · ${esc(e.cat)} · paid by <b>${esc(e.paidBy)}</b></div></div><div class="amt mono" style="flex:0 0 auto">${money(e.amount)}</div></div>
  <div style="margin-top:8px" class="cnt">${lk?'<span class="b ok">🔒 Settled</span>':`<button class="sm" data-act="ed" data-id="${e.id}">✎ Edit</button>`}<button class="sm" data-act="th" data-id="${e.id}">💬 ${n}</button>${e.personal?'<span class="b wa">👤 Personal</span>':''}${(e.hist||[]).length?`<span class="b ed">edited ×${e.hist.length}</span>`:''}</div>
  ${(e.hist||[]).length?`<div class="hist">${e.hist.map(h=>`<div><b>${esc(h.by)}</b> · ${fmt(h.ts)} — ${h.ch.map(esc).join('; ')}</div>`).join('')}</div>`:''}
  ${o?`<div>${cs.map(c=>cmH(c,e.id)).join('')}<div class="cf"><input class="cin" id="ci-${e.id}" data-e="${e.id}" placeholder="${r?'Replying…':'Comment — tag with @Name'}"><button class="pri sm" data-act="cm" data-id="${e.id}">Send</button></div></div>`:''}</div>`}).join(''):'<div class="card mu">No expenses yet — add the first one above.</div>';
 for(const k in keep){const i=document.getElementById(k);if(i)i.value=keep[k]}if(fo){const f=document.getElementById(fo);f&&f.focus&&f.focus()}}
async function saveExp(){const a=parseFloat($('#fa').value),d=$('#fd').value.trim();if(!(a>0)||!d)return toast('Enter an amount and description');
 const o={amount:Math.round(a*100)/100,paidBy:$('#fp').value,desc:d,cat:$('#fc').value,date:$('#fx').value||today(),personal:$('#fv').checked};
 if(edId){const old=exps.find(e=>e.id===edId);if(!old||locked(old))return toast('This expense is settled and locked');const ch=[];
  for(const k of['amount','paidBy','desc','cat','date'])if(old[k]!=o[k])ch.push(`${k}: ${old[k]} → ${o[k]}`);if(!!old.personal!==o.personal)ch.push(`personal: ${!!old.personal} → ${o.personal}`);if(!ch.length)return cancel();
  if(await put(P+'/exp',{...old,...o,hist:[...(old.hist||[]),{by:ME,ts:Date.now(),ch}]}))cancel()}
 else if(await put(P+'/exp',{id:uid(),ts:Date.now(),by:ME,...o,hist:[]})){$('#fa').value='';$('#fd').value='';$('#fv').checked=false}}
function cancel(){edId=null;$('#fa').value='';$('#fd').value='';$('#fv').checked=false;$('#ft').textContent='➕ Add expense';$('#fs').textContent='Add expense';$('#fcx').classList.add('hide')}
function startEd(id){const e=exps.find(x=>x.id===id);if(!e||locked(e))return;edId=id;$('#fa').value=e.amount;$('#fp').value=e.paidBy;$('#fd').value=e.desc;$('#fc').value=e.cat;$('#fx').value=e.date;$('#fv').checked=!!e.personal;
 $('#ft').textContent='✎ Editing expense';$('#fs').textContent='Save changes';$('#fcx').classList.remove('hide');$('#ft').scrollIntoView({behavior:'smooth',block:'center'})}
async function sendCm(eid){const i=document.getElementById('ci-'+eid),t=i.value.trim();if(!t)return;
 if(await put(P+'/cm',{id:uid(),eid,parent:rep[eid]||null,by:ME,text:t,ts:Date.now()})){i.value='';delete rep[eid]}}
/* ---- PDF ---- */
async function pdf(){const J=window.jspdf;if(!J)return toast('PDF library failed to load');const s=$('#ds').value,e=$('#de').value;
 const R=exps.filter(x=>(!s||x.date>=s)&&(!e||x.date<=e)).sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);if(!R.length)return toast('No transactions in that range');
 const d=new J.jsPDF(),cur=CUR==='₹'?'Rs. ':CUR,m=x=>cur+x.toFixed(2),cl=t=>String(t).replace(/[^\x20-\x7E\u00A0-\u00FF€]/g,'?');let y=38;
 d.setFillColor(79,70,229);d.rect(0,0,210,30,'F');d.setTextColor(255);d.setFont('helvetica','bold');d.setFontSize(17);d.text('Expense Statement',14,13);
 d.setFont('helvetica','normal');d.setFontSize(9);d.text('Room ID: '+RID+'   |   '+cl(room.name),14,20);d.text('Period: '+(s||'beginning')+' to '+(e||today())+'   |   Generated '+today(),14,25);
 d.setTextColor(20);const H=(t)=>{d.setFont('helvetica','bold');d.setFontSize(12);d.text(t,14,y);y+=6;d.setFont('helvetica','normal');d.setFontSize(10)};
 const S=R.filter(x=>!x.personal),tot=S.reduce((q,x)=>q+x.amount,0),pt=R.reduce((q,x)=>q+(x.personal?x.amount:0),0),n=calc(R),sh=tot/room.members.length;
 H('Summary');d.text(`Total spent: ${m(tot+pt)}   |   Shared (split): ${m(tot)}   |   Personal: ${m(pt)}`,14,y);y+=5.5;d.text(`Transactions: ${R.length}   |   Equal share each: ${m(sh)}`,14,y);y+=8;
 H('Net breakdown');room.members.forEach(p=>{const v=n[p]||0;d.text(`${cl(p)}`,16,y);d.text(`paid ${m(S.filter(x=>x.paidBy===p).reduce((q,x)=>q+x.amount,0))}`,70,y);d.text(`net ${v>=0?'+':'-'}${m(Math.abs(v))}`,125,y);y+=5.5});y+=3;
 if(pt>0){H('Personal expenses (not split)');room.members.forEach(p=>{const v=R.filter(x=>x.personal&&x.paidBy===p).reduce((q,x)=>q+x.amount,0);if(v){d.text(cl(p),16,y);d.text(m(v),70,y);y+=5.5}});y+=3}
 H('Who owes what');const t=xfers(n);if(!t.length){d.text('Everyone is settled up.',16,y);y+=6}t.forEach(([a,b,x])=>{d.text(`${cl(a)} owes ${cl(b)}  ${m(x)}`,16,y);y+=5.5});y+=4;
 const hd=()=>{d.setFillColor(238,240,255);d.rect(14,y-4.5,182,7,'F');d.setFont('helvetica','bold');d.setFontSize(9);d.text('Date',16,y);d.text('Description',40,y);d.text('Category',105,y);d.text('Paid by',138,y);d.text('Amount',194,y,{align:'right'});d.setFont('helvetica','normal');y+=7};
 H('Itemized transactions   (P = personal, not split)');hd();
 R.forEach((x,i)=>{if(y>278){d.addPage();y=20;hd()}d.setFontSize(9);d.text(x.date,16,y);d.text(cl(x.desc).slice(0,32),40,y);d.text(cl(x.cat)+(x.personal?' (P)':''),105,y);d.text(cl(x.paidBy).slice(0,18),138,y);d.text(m(x.amount),194,y,{align:'right'});d.setDrawColor(230);d.line(14,y+2,196,y+2);y+=6.5});
 const pc=d.getNumberOfPages();for(let i=1;i<=pc;i++){d.setPage(i);d.setFontSize(8);d.setTextColor(130);d.text(`SplitRoom · ${RID} · Page ${i}/${pc}`,105,290,{align:'center'})}
 const fn=`statement-${RID}-${s||'all'}_${e||'now'}.pdf`;d.save(fn)}
/* ---- events ---- */
const link=()=>location.href.split('#')[0]+'#'+RID;
const copy=async(t,m)=>{try{await navigator.clipboard.writeText(t);toast(m)}catch(e){prompt('Copy:',t)}};
document.addEventListener('click',async ev=>{const b=ev.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='theme')theme();else if(a==='create')create();else if(a==='join')join();else if(a==='pick')enterAs(b.dataset.n).catch(()=>{});else if(a==='leave')leave();
 else if(a==='cprid')copy(RID,'Room ID copied');else if(a==='cplink')copy(link(),'Invite link copied');
 else if(a==='save')saveExp();else if(a==='cancel')cancel();else if(a==='ed')startEd(id);else if(a==='pdf')pdf();
 else if(a==='th'){open.has(id)?open.delete(id):open.add(id);rLed();const i=document.getElementById('ci-'+id);i&&i.focus()}
 else if(a==='cm')sendCm(id);
 else if(a==='rp'){rep[b.dataset.e]=b.dataset.c;const i=document.getElementById('ci-'+b.dataset.e);i.value='@'+b.dataset.by+' ';i.placeholder='Replying…';i.focus()}
 else if(a==='mark'){if(confirm('Mark everything logged so far as paid up? The other party must approve before it locks.'))put(P+'/ms',{id:uid(),ts:Date.now(),by:ME,st:'pe'})}
 else if(a==='ap'){const m=mss.find(x=>x.id===id);if(m&&m.by!==ME)put(P+'/ms',{...m,st:'ok',ap:ME})}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.classList.contains('cin'))sendCm(e.target.dataset.e)});
$('#lc').innerHTML='<option value="">All categories</option>'+$('#fc').innerHTML;addEventListener('change',e=>{if(e.target.id==='lf'||e.target.id==='lc')rLed()});
$('#jr').addEventListener('input',()=>{found=null;$('#j2').classList.add('hide');$('#jb').textContent='Find room'});
(async()=>{const h=location.hash.slice(1).toUpperCase()||ls.g('sr:last')||'';if(!h)return;const me=ls.g('sr:me:'+h);$('#jr').value=h;
 if(me){const m=await lookup(h);if(m){found={rid:h,m};if(m.members.includes(me))return enter(h,me)}}
 else{const m=await lookup(h);if(m)toast('Invite detected — click Find room, then pick your name')}})();
</script></body></html>
